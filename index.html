<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Online P2P - Mesa Táctica</title>
    <!-- PeerJS para conexión Multijugador -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-main: #121214;
            --bg-panel: #1a1a1e;
            --bg-input: #26262b;
            --border-color: #3f3f46;
            --accent-red: #e11d48;
            --accent-red-hover: #f43f5e;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --dnd-gold: #d97706;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: grid;
            grid-template-columns: 320px 1fr 450px;
            height: 100vh;
            overflow: hidden;
        }

        /* Scrollbar personalizado */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        /* Estilos de Contenedores / Paneles */
        .panel {
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .panel-sheet {
            border-right: none;
            border-left: 1px solid var(--border-color);
            padding: 15px;
        }

        h2 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-red);
            margin: 0 0 5px 0;
            border-bottom: 2px solid var(--accent-red);
            padding-bottom: 4px;
        }

        h3 {
            font-size: 0.9rem;
            color: var(--dnd-gold);
            margin: 10px 0 5px 0;
            text-transform: uppercase;
        }

        /* Bloques de Red y Dados */
        .card-box {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
        }

        .dice-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        button {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--accent-red-hover); }
        button.btn-sec { background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); }
        button.btn-sec:hover { background-color: var(--border-color); }

        #log-dados {
            background: #09090b;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            flex-grow: 1;
            overflow-y: auto;
            font-family: monospace;
            min-height: 150px;
        }

        /* Centro: Mapa Táctico */
        .map-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #18181b;
            position: relative;
        }

        .map-toolbar {
            position: absolute;
            top: 15px;
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(26,26,30,0.85);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(4px);
        }

        #grid-tablero {
            width: 640px;
            height: 640px;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            background-color: #27272a;
            border: 2px solid var(--dnd-gold);
            border-radius: 4px;
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.7);
        }

        .token {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #2563eb;
            border: 2px solid white;
            position: absolute;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            user-select: none;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
        }
        .token.enemigo { background-color: #dc2626; }

        /* Formulario Común de Inputs */
        .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .input-group { display: flex; flex-direction: column; gap: 3px; flex: 1; }
        .input-group label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        input, textarea, select {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        input:focus, textarea:focus { border-color: var(--accent-red); outline: none; }

        /* --- HOJA DE PERSONAJE ESTILO D&D 2024 --- */
        .dnd-header { background: #09090b; padding: 10px; border-radius: 6px; margin-bottom: 12px; border: 1px dashed var(--dnd-gold); }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .stat-box {
            background: #09090b;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            text-align: center;
            padding: 4px;
        }
        .stat-box span { display: block; font-size: 0.65rem; color: var(--text-muted); font-weight: bold; }
        .stat-box input { width: 80%; text-align: center; padding: 2px; margin-top: 2px; font-size: 0.9rem; font-weight: bold; border-color: transparent; }

        .combat-metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .metric-box {
            background: var(--bg-main);
            border: 1px solid var(--dnd-gold);
            border-radius: 4px;
            padding: 6px;
            text-align: center;
        }
        .metric-box label { font-size: 0.65rem; color: var(--text-muted); display: block; font-weight: bold; text-transform: uppercase;}
        .metric-box input { width: 90%; text-align: center; font-weight: bold; font-size: 1rem; margin-top: 2px; }

        .skills-container {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            font-size: 0.8rem;
            max-height: 180px;
            overflow-y: auto;
        }
        .skill-line { display: flex; align-items: center; gap: 6px; padding: 2px 0; border-bottom: 1px solid #27272a; }
        .skill-line input[type="checkbox"] { accent-color: var(--accent-red); }
        .skill-line .mod-val { color: var(--dnd-gold); font-weight: bold; margin-left: auto; width: 30px; text-align: right; border: none; background: transparent;}

        .section-tabs {
            display: flex;
            gap: 4px;
            margin-top: 10px;
        }
        .tab-btn { flex: 1; padding: 6px; font-size: 0.75rem; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 4px 4px 0 0; }
        .tab-btn.active { background: var(--bg-panel); border-bottom-color: transparent; color: var(--dnd-gold); font-weight: bold; }
        .tab-content { background: var(--bg-main); border: 1px solid var(--border-color); border-top: none; padding: 10px; min-height: 120px; border-radius: 0 0 4px 4px; }
    </style>
</head>
<body>

    <!-- IZQUIERDA: Herramientas de Juego y Conexión -->
    <div class="panel">
        <h2>🌐 Conectividad Mesa</h2>
        <div class="card-box">
            <p style="margin: 0 0 8px 0; font-size: 0.85rem;">Tu ID de Sala: <b id="mi-id" style="color: #10b981;">Generando...</b></p>
            <div class="input-group">
                <input type="text" id="peer-id-destino" placeholder="Pegar ID del DM / Amigo">
                <button onclick="conectarAlDM()" style="margin-top: 6px; background: #10b981;">Unirse a Partida</button>
            </div>
        </div>

        <h2>🎲 Dados de Destino</h2>
        <div class="card-box">
            <div class="dice-grid">
                <button onclick="lanzarDado(4)">d4</button>
                <button onclick="lanzarDado(6)">d6</button>
                <button onclick="lanzarDado(8)">d8</button>
                <button onclick="lanzarDado(10)">d10</button>
                <button onclick="lanzarDado(12)">d12</button>
                <button onclick="lanzarDado(20)" style="background: var(--dnd-gold);">d20</button>
            </div>
            <button onclick="lanzarDado(100)" class="btn-sec" style="width: 100%;">Porcentual (d100)</button>
        </div>
        
        <h2>📜 Registro de Acciones</h2>
        <div id="log-dados"></div>
        <button onclick="document.getElementById('log-dados').innerHTML=''" class="btn-sec" style="font-size:0.8rem; padding: 6px;">Limpiar Chat</button>
    </div>

    <!-- CENTRO: Grid de Combate -->
    <div class="map-area">
        <div class="map-toolbar">
            <button onclick="crearTokenLocal('PJ', 'jugador')" style="padding: 6px 12px; font-size: 0.85rem;">+ Héroe (PJ)</button>
            <button onclick="crearTokenLocal('E', 'enemigo')" style="padding: 6px 12px; font-size: 0.85rem; background-color: #dc2626;">+ Enemigo (E)</button>
        </div>
        <div id="grid-tablero"></div>
    </div>

    <!-- DERECHA: Ficha Completa del Jugador -->
    <div class="panel panel-sheet">
        <h2>🛡️ Registro de Personaje (D&D)</h2>
        
        <!-- Encabezado Ficha -->
        <div class="dnd-header">
            <div class="form-row">
                <div class="input-group"><label>Nombre Personaje</label><input type="text" id="char-name" value="Garith"></div>
                <div class="input-group" style="max-width: 80px;"><label>Nivel</label><input type="number" value="1"></div>
            </div>
            <div class="form-row">
                <div class="input-group"><label>Clase / Subclase</label><input type="text" value="Guerrero / Campeón"></div>
                <div class="input-group"><label>Especie</label><input type="text" value="Humano"></div>
            </div>
        </div>

        <h3>Atributos Core</h3>
        <!-- Bloque de Atributos -->
        <div class="stats-row">
            <div class="stat-box"><span>FUE</span><input type="number" value="16"></div>
            <div class="stat-box"><span>DES</span><input type="number" value="14"></div>
            <div class="stat-box"><span>CON</span><input type="number" value="15"></div>
            <div class="stat-box"><span>INT</span><input type="number" value="10"></div>
            <div class="stat-box"><span>SAB</span><input type="number" value="12"></div>
            <div class="stat-box"><span>CAR</span><input type="number" value="8"></div>
        </div>

        <!-- Métricas Combate Críticas -->
        <div class="combat-metrics">
            <div class="metric-box"><label>Armadura (CA)</label><input type="number" value="16"></div>
            <div class="metric-box"><label>Iniciativa</label><input type="number" value="2"></div>
            <div class="metric-box"><label>Velocidad</label><input type="text" value="30 ft"></div>
            <div class="metric-box" style="border-color: var(--accent-red);"><label>Vida (PG)</label><input type="number" value="12"></div>
        </div>

        <h3>Competencias y Habilidades</h3>
        <div class="form-row">
            <div class="input-group"><label>Bono Competencia</label><input type="text" value="+2" style="text-align:center; font-weight:bold;"></div>
            <div class="input-group"><label>Percepción Pasiva</label><input type="number" value="11" style="text-align:center;"></div>
            <div class="input-group"><label>Inspiración</label><input type="text" value="⬜" style="text-align:center; cursor:pointer;" onclick="this.value = this.value === '⬜' ? '🔥' : '⬜'"></div>
        </div>

        <div class="skills-container">
            <div class="skill-line"><input type="checkbox" checked> <label>Atletismo (Fue)</label> <input class="mod-val" value="+5"></div>
            <div class="skill-line"><input type="checkbox"> <label>Acrobacias (Des)</label> <input class="mod-val" value="+2"></div>
            <div class="skill-line"><input type="checkbox"> <label>Sigilo (Des)</label> <input class="mod-val" value="+2"></div>
            <div class="skill-line"><input type="checkbox" checked> <label>Historia (Int)</label> <input class="mod-val" value="+2"></div>
            <div class="skill-line"><input type="checkbox"> <label>Perspicacia (Sab)</label> <input class="mod-val" value="+1"></div>
            <div class="skill-line"><input type="checkbox" checked> <label>Percepción (Sab)</label> <input class="mod-val" value="+3"></div>
            <div class="skill-line"><input type="checkbox"> <label>Intimidación (Car)</label> <input class="mod-val" value="-1"></div>
            <div class="skill-line"><input type="checkbox"> <label>Persuasión (Car)</label> <input class="mod-val" value="-1"></div>
        </div>

        <!-- Pestañas Interactivas para Notas, Ataques o Conjuros -->
        <div class="section-tabs">
            <button class="tab-btn active" onclick="cambiarTab('tab-ataques', this)">Ataques</button>
            <button class="tab-btn" onclick="cambiarTab('tab-equipo', this)">Equipo / Oro</button>
            <button class="tab-btn" onclick="cambiarTab('tab-conjuros', this)">Conjuros</button>
        </div>
        <div class="tab-content" id="tab-ataques">
            <textarea style="width:94%; height:90px; background:transparent; border:none; resize:none;" placeholder="Nombre | Bonif. | Daño y Notas&#10;Espada Larga | +5 | 1d8+3 Cortante&#10;Arco Corto | +4 | 1d6+2 Perforante"></textarea>
        </div>
        <div class="tab-content" id="tab-equipo" style="display:none;">
            <textarea style="width:94%; height:90px; background:transparent; border:none; resize:none;" placeholder="Monedas: PO: 15, PP: 10&#10;Mochila, Cuerda de cáñamo, Antorchas (5), Raciones de viaje."></textarea>
        </div>
        <div class="tab-content" id="tab-conjuros" style="display:none;">
            <textarea style="width:94%; height:90px; background:transparent; border:none; resize:none;" placeholder="Espacios Nivel 1: [ ][ ]&#10;Trucos: Luz, Agarre Electrizante&#10;Preparados: Proyectil Mágico"></textarea>
        </div>
    </div>

    <script>
        // --- MULTIJUGADOR NET (PEERJS) ---
        let peer = new Peer(); 
        let conexiones = [];
        let miId = "";

        peer.on('open', (id) => {
            miId = id;
            document.getElementById('mi-id').innerText = id;
        });

        peer.on('connection', (conn) => { configurarConexion(conn); });

        function conectarAlDM() {
            const idDestino = document.getElementById('peer-id-destino').value.trim();
            if (idDestino) {
                const conn = peer.connect(idDestino);
                configurarConexion(conn);
            }
        }

        function configurarConexion(conn) {
            conexiones.push(conn);
            conn.on('open', () => {
                enviarDatos({ tipo: 'sistema', msg: '🛡️ ¡Un aventurero se ha unido a la mesa!' });
            });
            conn.on('data', (data) => { procesarDatosRed(data); });
        }

        function enviarDatos(data) {
            conexiones.forEach(conn => { if (conn.open) conn.send(data); });
        }

        function procesarDatosRed(data) {
            if (data.tipo === 'dado') {
                mostrarLogDado(data.usuario, data.caras, data.resultado);
            } else if (data.tipo === 'sistema') {
                document.getElementById('log-dados').innerHTML += `<div style="color: #eab308; margin-bottom:4px;">${data.msg}</div>`;
            } else if (data.tipo === 'mover-token') {
                const token = document.getElementById(data.id);
                if (token) {
                    token.style.left = data.x + "px";
                    token.style.top = data.y + "px";
                }
            } else if (data.tipo === 'crear-token') {
                crearTokenVisual(data.id, data.texto, data.clase, data.x, data.y);
            }
        }

        // --- DADOS ---
        function lanzarDado(caras) {
            const resultado = Math.floor(Math.random() * caras) + 1;
            const nombre = document.getElementById('char-name').value || "Héroe";
            mostrarLogDado(nombre, caras, resultado);
            enviarDatos({ tipo: 'dado', usuario: nombre, caras: caras, resultado: resultado });
        }

        function mostrarLogDado(usuario, caras, resultado) {
            const log = document.getElementById('log-dados');
            let estilo = "margin-bottom: 4px; color: var(--text-main);";
            if (caras === 20 && resultado === 20) estilo += "color: #10b981; font-weight:bold; text-shadow: 0 0 4px rgba(16,185,129,0.4);";
            if (caras === 20 && resultado === 1) estilo += "color: #ef4444; font-weight:bold;";
            
            log.innerHTML += `<div style="${estilo}">🎲 <b>${usuario}</b> (d${caras}): <span style="font-size:1.05rem;">${resultado}</span></div>`;
            log.scrollTop = log.scrollHeight;
        }

        // --- GRID Y TOKENS ---
        const tablero = document.getElementById('grid-tablero');

        function crearTokenLocal(texto, tipo) {
            const tokenId = 'token-' + Date.now();
            const clase = tipo === 'enemigo' ? 'token enemigo' : 'token';
            crearTokenVisual(tokenId, texto, clase, 2, 2);
            enviarDatos({ tipo: 'crear-token', id: tokenId, texto: texto, clase: clase, x: 2, y: 2 });
        }

        function crearTokenVisual(id, texto, clase, x, y) {
            if(document.getElementById(id)) return;
            const token = document.createElement('div');
            token.id = id;
            token.className = clase;
            token.innerText = texto;
            token.style.left = x + "px";
            token.style.top = y + "px";
            hacerArrastrable(token);
            tablero.appendChild(token);
        }

        function hacerArrastrable(elemento) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elemento.onmousedown = arrastrarMouseDown;

            function arrastrarMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = cerrarArrastrarElemento;
                document.onmousemove = elementoArrastrar;
            }

            function elementoArrastrar(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                
                let nuevoTop = Math.round((elemento.offsetTop - pos2) / 40) * 40 + 2;
                let nuevoLeft = Math.round((elemento.offsetLeft - pos1) / 40) * 40 + 2;

                if (nuevoTop >= 0 && nuevoTop <= 600) elemento.style.top = nuevoTop + "px";
                if (nuevoLeft >= 0 && nuevoLeft <= 600) elemento.style.left = nuevoLeft + "px";

                enviarDatos({ tipo: 'mover-token', id: elemento.id, x: nuevoLeft, y: nuevoTop });
            }

            function cerrarArrastrarElemento() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        // --- CONTROL DE PESTAÑAS ---
        function cambiarTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).style.display = 'block';
            btn.classList.add('active');
        }
    </script>
</body>
</html>
